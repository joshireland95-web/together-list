<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Together List</title>
<meta name="description" content="Things we want to do together" />
<meta property="og:title" content="The Together List" />
<meta property="og:description" content="Things we want to do together" />
<meta name="theme-color" content="#fbf7f1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Together" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #fbf7f1; --card: #ffffff; --ink: #24222b; --muted: #77727f; --line: #ebe4da;
    --green: #3d9a6a; --green-soft: #daf3e4; --terra: #f2775a; --terra-soft: #ffe2d9;
    --mustard: #f0b43c; --mustard-soft: #fff0c8; --blue: #5b93dd; --blue-soft: #deebfc;
    --lilac: #a98be0; --lilac-soft: #efe6ff;
    --r: 20px; --shadow: 0 1px 2px rgba(40,30,60,.04), 0 6px 20px rgba(40,30,60,.07);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; }
  body.noscroll { overflow: hidden; }
  #app { max-width: 640px; margin: 0 auto; padding: 0 16px calc(110px + var(--safe-b)); min-height: 100vh; }
  h1, h2, h3 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700; margin: 0; letter-spacing: -.025em; }
  h1 { font-size: 34px; line-height: 1.05; font-weight: 800; }
  h2 { font-size: 19px; margin-bottom: 10px; }
  h3 { font-size: 18px; margin: 6px 0 2px; }
  a { color: #2f8a5c; }
  p { margin: 8px 0; }
  code { background: var(--lilac-soft); padding: 2px 8px; border-radius: 8px; font-size: 14px; }
  .muted { color: var(--muted); } .small { font-size: 13.5px; }
  .center { text-align: center; padding: 60px 0; }
  .row { display: flex; align-items: center; } .between { justify-content: space-between; } .gap { gap: 8px; } .wrap { flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  /* picnic-blanket gingham */
  .blanket { height: 14px; border-radius: 0 0 10px 10px; margin: 0 -16px 18px;
    background:
      linear-gradient(90deg, rgba(242,119,90,.5) 50%, transparent 50%) 0 0/24px 24px,
      linear-gradient(rgba(242,119,90,.5) 50%, transparent 50%) 0 0/24px 24px, #fff1ea; }
  body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 320px; z-index: -1; pointer-events: none;
    background: radial-gradient(60% 80% at 10% 0%, #ffe2d9 0%, transparent 70%), radial-gradient(50% 70% at 95% 10%, #efe6ff 0%, transparent 70%), radial-gradient(50% 60% at 60% 0%, #fff0c8 0%, transparent 70%); opacity: .9; }
  .top { padding: 0 0 8px; } .top.slim { padding-top: 22px; }
  .top p { margin: 4px 0 0; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--line); background: var(--card);
    color: var(--ink); font: inherit; font-weight: 600; padding: 11px 16px; border-radius: 14px; cursor: pointer; text-decoration: none; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: linear-gradient(135deg, #46ab78, #3a9064); border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgba(61,154,106,.25); }
  .btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
  .btn.link { border: 0; background: none; padding: 6px 4px; color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
  .btn.danger { color: #a3402a; } .btn.danger:not(.link) { border-color: #e7c2b6; }
  .btn.messenger { background: #0a7cff; border-color: #0a7cff; color: #fff; }
  .btn:disabled { opacity: .55; }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center;
    font-size: 26px; color: var(--ink); cursor: pointer; text-decoration: none; }
  .iconbtn svg { width: 24px; height: 24px; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 6px; scrollbar-width: none; }
  .chip { border: 1.5px solid var(--line); background: transparent; border-radius: 99px; padding: 6px 14px; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .chip { font-weight: 600; background: rgba(255,255,255,.6); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* cards */
  .cards { display: flex; flex-direction: column; gap: 12px; padding-top: 10px; }
  .card { display: block; background: var(--card); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow);
    color: inherit; text-decoration: none; position: relative; overflow: hidden; transition: transform .15s, box-shadow .15s; }
  a.card:active { transform: scale(.985); }
  @media (hover: hover) { a.card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(40,30,60,.05), 0 12px 28px rgba(40,30,60,.1); } }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--line); }
  .card.s-idea::before { background: linear-gradient(var(--terra), #f7a28c); }
  .card.s-planning::before { background: linear-gradient(var(--mustard), #f7d27e); }
  .card.s-booked::before { background: linear-gradient(var(--green), #7fd0a3); }
  .card.s-done::before { background: linear-gradient(var(--blue), #9cc0f0); } .card.s-done { opacity: .85; }
  .card.poll::before { background: linear-gradient(var(--lilac), #cdb8f5); }
  .card .meta { color: var(--muted); font-size: 14px; }
  .card .foot { margin-top: 10px; }
  .card .when { font-size: 13px; font-weight: 600; color: var(--muted); }
  .flag { margin-top: 8px; font-size: 13px; font-weight: 600; color: #9a6a00; background: var(--mustard-soft); display: inline-block; padding: 3px 10px; border-radius: 99px; }
  .pill { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px; border-radius: 99px; background: #eee6d6; color: var(--muted); }
  .pill.s-idea { background: var(--terra-soft); color: #c2452a; } .pill.s-planning { background: var(--mustard-soft); color: #9a6a00; }
  .pill.s-booked { background: var(--green-soft); color: #23764b; } .pill.s-done { background: var(--blue-soft); color: #2f66b0; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .notice { margin-top: 12px; background: linear-gradient(135deg, #fff0c8, #ffe2d9); padding: 12px 16px; border-radius: 16px; font-size: 14px; font-weight: 500; }

  .av { --c: #888; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #fff;
    font-weight: 700; font-size: 15px; flex: none; border: 2px solid var(--card); }
  .av.sm { width: 24px; height: 24px; font-size: 11px; margin-left: -6px; }
  .av.dim { background: #e3dde6; color: #fff; }
  .avs { display: flex; padding-left: 6px; }

  /* detail */
  .detail { padding-top: 12px; }
  .detail h1 { margin: 8px 0 14px; }
  .detail section { margin-top: 26px; }
  .desc { white-space: normal; } .detail .desc { margin-top: 16px; }
  .seg { display: flex; background: #f0ebe4; border-radius: 16px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 9px; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 12px; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .seg button.on.s-idea { background: var(--terra); color: #fff; } .seg button.on.s-planning { background: var(--mustard); color: #fff; }
  .seg button.on.s-done { background: var(--blue); color: #fff; } .seg button.on.s-booked { background: var(--green); color: #fff; }
  .facts { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 16px 0 0; }
  .facts dt { color: var(--muted); font-size: 14px; } .facts dd { margin: 0; }
  .people { display: flex; flex-wrap: wrap; gap: 10px; }
  .person { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; font: inherit; font-size: 13px; cursor: pointer; color: var(--muted); min-width: 52px; }
  .person.on { color: var(--ink); font-weight: 500; }
  .person .av { width: 44px; height: 44px; font-size: 18px; }
  .pays { list-style: none; padding: 0; margin: 10px 0; display: flex; flex-direction: column; gap: 8px; }
  .pays li { display: flex; align-items: center; gap: 10px; background: var(--card); padding: 10px 12px; border-radius: 16px; box-shadow: var(--shadow); }
  .pays li .av { margin: 0; } .pays li > div { flex: 1; }
  .x { border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer; padding: 0 6px; }
  .settle { background: var(--green-soft); border-radius: 16px; padding: 10px 14px; margin: 10px 0; display: flex; flex-direction: column; gap: 4px; }

  /* polls */
  .poll h3 { margin-top: 4px; }
  .vote { display: flex; gap: 8px; margin: 12px 0 8px; }
  .vote button { flex: 1; padding: 11px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font: inherit; font-weight: 500; cursor: pointer; color: var(--ink); }
  .vote button { font-weight: 600; border-radius: 14px; }
  .vote .yes.on { background: linear-gradient(135deg, #46ab78, #3a9064); border-color: transparent; color: #fff; }
  .vote .no.on { background: #6f675a; border-color: #6f675a; color: #fff; }
  .tally { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .tally > div { display: flex; align-items: center; gap: 4px; }
  .tally .av.sm { margin-left: 0; }
  .poll .actions { margin-top: 12px; }
  .poll.closed { opacity: .8; }
  .past { margin-top: 24px; } .past summary { cursor: pointer; color: var(--muted); font-weight: 500; }

  /* calendar */
  .cal { background: var(--card); border-radius: var(--r); padding: 10px; box-shadow: var(--shadow); margin-top: 14px; }
  .calhead h2 { margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .grid.dow div { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 0; font-weight: 700; }
  .cell { min-height: 56px; border: 0; background: #faf7f3; border-radius: 12px; padding: 4px; font: inherit; color: inherit; text-align: left;
    display: flex; flex-direction: column; gap: 2px; cursor: pointer; overflow: hidden; min-width: 0; }
  .cell.pad { background: transparent; cursor: default; }
  .cell .n { font-size: 13px; font-weight: 500; }
  .cell.today .n { background: linear-gradient(135deg, var(--terra), #f59ab0); color: #fff; border-radius: 99px; padding: 0 6px; align-self: flex-start; }
  .cell.sel { outline: 2px solid var(--ink); outline-offset: -1px; }
  .evs { display: none; }
  .ev { display: block; font-size: 11px; line-height: 1.3; padding: 1px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--terra-soft); }
  .ev.s-planning { background: var(--mustard-soft); } .ev.s-booked { background: var(--green-soft); } .ev.s-done { background: var(--blue-soft); }
  .more { font-size: 11px; color: var(--muted); }
  .dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--terra); }
  .dots i.s-planning { background: var(--mustard); } .dots i.s-booked { background: var(--green); } .dots i.s-done { background: var(--blue); }
  .dots i.dl { background: transparent; border: 1.5px solid #9a5a12; }
  @media (min-width: 560px) { .evs { display: flex; flex-direction: column; gap: 2px; } .dots i:not(.dl) { display: none; } .cell { min-height: 78px; } }
  .dayview, .dayview + section { margin-top: 22px; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
  .line span:last-child { white-space: nowrap; font-size: 14px; }

  /* me */
  section { margin-top: 24px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: #4b4754; }
  label.check { flex-direction: row; align-items: center; gap: 10px; font-weight: 400; color: var(--ink); }
  input, textarea, select { font: inherit; font-size: 16px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); width: 100%; min-width: 0; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--green); }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--green); outline-offset: 0; border-color: transparent; }
  fieldset { border: 1.5px solid var(--line); background: rgba(255,255,255,.5); border-radius: 18px; padding: 10px 12px 12px; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  legend { font-size: 13px; font-weight: 700; color: var(--muted); padding: 0 6px; text-transform: uppercase; letter-spacing: .05em; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatches label { flex-direction: row; }
  .swatches input { position: absolute; opacity: 0; width: 0; }
  .swatches span { width: 32px; height: 32px; border-radius: 50%; background: var(--c); cursor: pointer; border: 3px solid var(--paper); box-shadow: 0 0 0 1.5px var(--line); }
  .swatches input:checked + span { box-shadow: 0 0 0 2.5px var(--ink); }

  .login { padding-top: 0; max-width: 420px; margin: 0 auto; }
  .login h1 { margin: 40px 0 6px; font-size: 44px; line-height: 1; }
  .login form { margin-top: 26px; }

  /* nav, fab, modal, toast */
  #nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 4px; background: rgba(255,255,255,.85);
    backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); border-top: 1px solid rgba(0,0,0,.05); padding: 6px 8px calc(6px + var(--safe-b)); z-index: 10; }
  #nav a { position: relative; flex: 1; max-width: 140px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0;
    font-size: 12px; color: var(--muted); text-decoration: none; border-radius: 12px; }
  #nav a.on { color: var(--ink); font-weight: 700; }
  #nav a.on .ico { background: linear-gradient(135deg, var(--terra-soft), var(--lilac-soft)); color: var(--terra); }
  #nav .ico { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 99px; transition: background .2s; }
  #nav .ico svg { width: 22px; height: 22px; }
  .badge { position: absolute; top: 0; left: 56%; background: #ee6b8f; color: #fff; font-size: 11px; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 5px; }
  .fab { position: fixed; right: max(18px, calc(50% - 302px)); bottom: calc(84px + var(--safe-b)); width: 58px; height: 58px; border-radius: 50%; border: 0;
    background: linear-gradient(135deg, #f7896a, #ee6b8f); color: #fff; box-shadow: 0 8px 22px rgba(238,107,143,.38); cursor: pointer; display: grid; place-items: center; z-index: 9; }
  .fab svg { width: 28px; height: 28px; stroke-width: 2.5; }
  #modal { position: fixed; inset: 0; background: rgba(43,42,38,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  #modal[hidden] { display: none; }
  .sheet { background: var(--paper); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0;
    padding: 18px 18px calc(24px + var(--safe-b)); animation: up .2s ease-out; }
  @media (min-width: 600px) { #modal { align-items: center; } .sheet { border-radius: 22px; } }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  #toast { position: fixed; left: 50%; bottom: calc(150px + var(--safe-b)); transform: translate(-50%, 20px); background: var(--ink); color: var(--paper);
    padding: 10px 18px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 30; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
<script src="config.js"></script>
</head>
<body>
  <main id="app"><div class="center muted">Loading…</div></main>
  <nav id="nav" hidden></nav>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
